<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Mona 💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    /* ── Lock page to viewport — no scrollbar ── */
    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: url('heart.png') center center / cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
    }

    /* ══ CONFETTI ══ */
    .cp {
      position: fixed; top: -22px;
      pointer-events: none; z-index: 200;
      animation: cpFall linear forwards;
    }
    @keyframes cpFall {
      0%   { transform: translateY(0) rotate(0deg) scale(1);       opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg) scale(.6); opacity: 0; }
    }

    /* ══ FLOATING EMOJI HEARTS ══ */
    .fh {
      position: fixed; pointer-events: none; z-index: 3;
      animation: fhRise linear forwards;
    }
    @keyframes fhRise {
      0%   { transform:translateY(105vh) scale(0); opacity:0; }
      8%   { opacity:.8; }
      90%  { opacity:.4; }
      100% { transform:translateY(-120px) scale(1.1); opacity:0; }
    }

    /* ══ PAGE — fits exactly in viewport ══ */
    .page {
      position: relative; z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* gap scales with viewport height so content never overflows */
      gap: clamp(4px, 1.6vh, 18px);
      padding: clamp(8px,2vh,20px) clamp(16px,4vw,40px);
      animation: pageIn .9s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    @keyframes pageIn {
      from { opacity:0; transform:translateY(24px) scale(.95); }
      to   { opacity:1; transform:translateY(0)    scale(1); }
    }

    /* ══ CAKE ══ */
    .cake {
      /* vh-based so it shrinks on short screens */
      font-size: clamp(2rem, 8vh, 4.5rem);
      display: block;
      animation: cakePop .8s cubic-bezier(.34,1.56,.64,1) .1s both,
                 cakeBob 3.2s ease-in-out 1s infinite;
      filter: drop-shadow(0 4px 12px rgba(180,50,200,.3));
      line-height: 1;
    }
    @keyframes cakePop {
      from { transform: scale(0) rotate(-15deg); opacity:0; }
      to   { transform: scale(1) rotate(0deg);   opacity:1; }
    }
    @keyframes cakeBob {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-8px); }
    }

    /* ══ HAPPY BIRTHDAY ══ */
    .hb-title {
      font-family: 'Great Vibes', cursive;
      /* clamp between a floor and 10vh so it scales down on short screens */
      font-size: clamp(2rem, 10vh, 6rem);
      color: #5c1a8a;
      line-height: 1.1;
      text-shadow: 0 3px 22px rgba(130,30,200,.25);
      animation: fadeUp .8s ease .25s both;
    }

    /* ══ MY DEAR MONA ══ */
    .mona-name {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(1.6rem, 8vh, 4.5rem);
      background: linear-gradient(135deg, #e91e8c, #c2185b, #ff4da6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding-left: 0.14em;
      animation: fadeUp .8s ease .5s both;
      line-height: 1.1;
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(22px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ══ HEARTS ROW ══ */
    .hearts-row {
      display: flex; justify-content: center; align-items: center;
      gap: clamp(8px,2.5vw,16px);
      font-size: clamp(1.2rem, 4vh, 2rem);
      animation: fadeUp .8s ease .75s both;
    }
    .hr-item { animation: heartBeat 1.5s ease-in-out infinite; }
    .hr-item:nth-child(2) { animation-delay:.25s; font-size:1.3em; }
    .hr-item:nth-child(3) { animation-delay:.5s; }
    @keyframes heartBeat {
      0%,100% { transform:scale(1); }
      15%     { transform:scale(1.35); }
      30%     { transform:scale(1); }
      45%     { transform:scale(1.18); }
      60%     { transform:scale(1); }
    }

    /* ══ SUBTITLE ══ */
    .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(.88rem, 2.5vh, 1.18rem);
      color: #4a148c;
      letter-spacing: 1px;
      animation: fadeUp .8s ease 1s both;
    }

    /* ══ DIVIDER ══ */
    .divider {
      display: flex; align-items: center; gap: 10px;
      color: rgba(100,30,160,.85);
      font-size: clamp(.82rem, 2vh, 1rem);
      letter-spacing: 6px;
      animation: fadeUp .8s ease 1.1s both;
    }
    .divider::before, .divider::after {
      content: ''; flex:1; height:1px;
      background: linear-gradient(to right, transparent, rgba(150,50,190,.32), transparent);
      width: clamp(30px,8vw,70px);
    }

    /* ══ CONTINUE BUTTON ══ */
    .btn-wrap {
      animation: fadeUp .8s ease 1.3s both;
    }

    .btn-continue {
      display: inline-flex; align-items: center; gap: 10px;
      text-decoration: none; color: white;
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(.82rem, 2.2vh, 1.08rem);
      font-weight: 400; letter-spacing: 3px;
      padding: clamp(12px,2.5vh,18px) clamp(30px,8vw,58px);
      background: linear-gradient(135deg, #e91e8c 0%, #9c27b0 50%, #e91e8c 100%);
      background-size: 200% 200%;
      border-radius: 50px;
      box-shadow: 0 8px 28px rgba(233,30,140,.48), 0 2px 6px rgba(0,0,0,.1);
      animation: btnGrad 3.5s ease-in-out infinite,
                 btnGlow  2.5s ease-in-out infinite;
      transition: transform .25s, box-shadow .25s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-continue:hover {
      transform: translateY(-4px) scale(1.06);
      box-shadow: 0 16px 48px rgba(233,30,140,.65), 0 0 80px rgba(156,39,176,.28);
    }
    .btn-continue:active { transform: scale(.96); }

    @keyframes btnGrad {
      0%   { background-position: 0%   50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0%   50%; }
    }
    @keyframes btnGlow {
      0%,100% { box-shadow: 0 8px 28px rgba(233,30,140,.48); }
      50%     { box-shadow: 0 8px 44px rgba(233,30,140,.72), 0 0 80px rgba(156,39,176,.3); }
    }

    .btn-h {
      font-size: 1.2em; display: inline-block;
      animation: heartBeat 1.5s ease-in-out infinite;
    }
    .btn-h:last-child { animation-delay: .35s; }

  </style>
</head>
<body>

<div id="cpW" style="position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden;"></div>
<div id="fhC"></div>

<div class="page">
  <span class="cake">🎂</span>

  <div class="hb-title">Happy Birthday</div>
  <div class="mona-name">My Dear Mona</div>

  <div class="hearts-row">
    <span class="hr-item">💕</span>
    <span class="hr-item">💖</span>
  </div>

  <p class="subtitle">You are the most beautiful part of my world ✨</p>

  <div class="divider">💜 &nbsp; 💜</div>

  <div class="btn-wrap">
    <button type="button" class="btn-continue" onclick="enterMemories()">
      <span class="btn-h">❤</span>
      Enter Our Memories
      <span class="btn-h">❤</span>
    </button>
  </div>
</div>


<script>
/* Confetti */
(function(){
  const w = document.getElementById('cpW');
  const cl = ['#9c27b0','#e91e8c','#f06292','#ab47bc','#d81b60','#e040fb','#c2185b','#ba68c8','#ff80ab','#7b1fa2','#f48fb1','#880e4f'];
  function sp(){
    const el = document.createElement('div');
    el.className = 'cp';
    const w2=Math.random()*10+5, h2=Math.random()*14+6, circ=Math.random()>.5;
    const dur=(Math.random()*3.5+3).toFixed(1);
    el.style.cssText = `left:${Math.random()*100}%;width:${circ?w2:w2}px;height:${circ?w2:h2}px;background:${cl[Math.floor(Math.random()*cl.length)]};border-radius:${circ?'50%':'3px'};animation-duration:${dur}s;animation-delay:${(Math.random()*1.2).toFixed(1)}s;`;
    w.appendChild(el);
    setTimeout(()=>el.remove(),(parseFloat(dur)+2)*1000);
  }
  for(let i=0;i<28;i++) setTimeout(sp, Math.random()*1500);
  setInterval(sp, 200);
})();

/* Floating emoji hearts */
const HE = ['💕','💖','💗','💝','💜','🩷','💞','❤️','💓'];
(function loop(){
  const el = document.createElement('div');
  el.className = 'fh';
  el.textContent = HE[Math.floor(Math.random()*HE.length)];
  const dur = (Math.random()*8+6).toFixed(1);
  el.style.cssText = `left:${Math.random()*100}%;font-size:${(Math.random()*18+12).toFixed(0)}px;animation-duration:${dur}s;animation-delay:${(Math.random()*2).toFixed(1)}s;`;
  document.getElementById('fhC').appendChild(el);
  setTimeout(()=>el.remove(),(parseFloat(dur)+3)*1000);
  setTimeout(loop, 900);
})();

/* Button click → mark music as requested, go to memories page.
   The click gesture carries over so memories.html can autoplay. */
function enterMemories() {
  sessionStorage.setItem('bgMusic', 'playing');
  window.location.href = 'memories.html';
}
</script>
</body>
</html>
