<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Mona 💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      min-height: 100vh;
      background: url('heart.png') center center / cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      font-family: 'Montserrat', sans-serif;
      position: relative;
    }

    /* ══ CONFETTI ══ */
    .cp {
      position: fixed; top: -22px;
      pointer-events: none; z-index: 200;
      animation: cpFall linear forwards;
    }
    @keyframes cpFall {
      0%   { transform: translateY(0) rotate(0deg) scale(1);       opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg) scale(.6); opacity: 0; }
    }

    /* ══ PAGE ENTRANCE ══ */
    .main {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(22px, 5vw, 34px);
      padding: 36px 20px;
      animation: pageIn .9s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(32px) scale(.94); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }

    /* ══ GIFT SCENE ══ */
    .gift-scene {
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      position: relative;
      animation: gFloat 3.4s ease-in-out infinite;
      transition: filter .3s;
      -webkit-tap-highlight-color: transparent;
    }
    .gift-scene:hover {
      filter: brightness(1.08) drop-shadow(0 26px 64px rgba(74,20,140,.52));
    }
    .gift-scene:active { animation: none; transform: scale(.95); }
    @keyframes gFloat {
      0%,100% { transform: translateY(0)    rotate(.4deg); }
      50%     { transform: translateY(-14px) rotate(-.4deg); }
    }

    /* ── Sparkles around box ── */
    .sp {
      position: absolute;
      font-style: normal;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255,215,0,.95), 0 0 22px rgba(255,165,0,.6);
      animation: spTwinkle 2.3s ease-in-out infinite;
      pointer-events: none;
      z-index: 20;
      line-height: 1;
      font-size: clamp(14px,3.6vw,20px);
    }
    .sp1 { top: 4%;   right: -18px; }
    .sp2 { top: 22%;  left: -20px;  animation-delay: .55s; font-size: clamp(11px,2.8vw,15px); }
    .sp3 { bottom: 22%; right: -22px; animation-delay: 1.1s; font-size: clamp(9px,2.3vw,13px); }
    .sp4 { bottom: 12%; left: -18px; animation-delay: 1.7s; font-size: clamp(11px,2.8vw,15px); }
    .sp5 { top: 50%;  right: -16px; animation-delay: .8s;  font-size: clamp(9px,2.2vw,12px); }
    .sp6 { top: 2%;   left: -12px;  animation-delay: 1.4s; font-size: clamp(9px,2.2vw,12px); }
    @keyframes spTwinkle {
      0%,100% { opacity:1;   transform: scale(1)   rotate(0deg); }
      50%     { opacity:.08; transform: scale(.35) rotate(72deg); }
    }

    /* ── GIFT IMAGE ── */
    .gift-img {
      width: clamp(240px, 64vw, 320px);
      height: auto;
      display: block;
      filter: drop-shadow(0 22px 50px rgba(120,30,180,.45))
              drop-shadow(0 6px 16px rgba(0,0,0,.22));
    }

    /* ══ LABEL ══ */
    .gift-label {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .lbl-to {
      font-size: clamp(.78rem, 2.3vw, .94rem);
      letter-spacing: 5px; font-weight: 300;
      color: #4a148c;
    }
    .lbl-name {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.1rem, 7.5vw, 3.4rem);
      color: #4a148c; line-height: 1;
    }
    .lbl-from {
      font-size: clamp(.78rem, 2.3vw, .94rem);
      letter-spacing: 3px; font-weight: 300;
      color: #4a148c;
    }
    .lbl-from em {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-size: 1.28em;
      font-weight: 600; color: #38006b;
    }
    .lbl-tap {
      margin-top: 10px;
      display: flex; flex-direction: column;
      align-items: center; gap: 3px;
      font-size: clamp(.74rem, 2.1vw, .88rem);
      letter-spacing: 4px; color: #6a1b9a;
      font-weight: 400;
      animation: tapPulse 2.1s ease-in-out infinite;
    }
    .lbl-tap .arr { font-size: .95rem; animation: arrBounce 1.6s ease-in-out infinite; }

    @keyframes tapPulse { 0%,100%{ opacity:1 } 50%{ opacity:.38 } }
    @keyframes arrBounce {
      0%,100%{ transform:translateY(0) }
      50%    { transform:translateY(-7px) }
    }

    /* ══ CUSTOM TOOLTIP ══ */
    .gift-tooltip {
      position: absolute;
      top: -54px;
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: linear-gradient(135deg, #e91e8c, #9c27b0);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(.68rem, 1.9vw, .82rem);
      font-weight: 500;
      letter-spacing: 3px;
      padding: 8px 20px;
      border-radius: 50px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      box-shadow: 0 6px 24px rgba(233,30,140,.45);
      transition: opacity .25s ease, transform .25s ease;
      z-index: 30;
    }
    /* Arrow pointing down */
    .gift-tooltip::after {
      content: '';
      position: absolute;
      top: 100%; left: 50%;
      transform: translateX(-50%);
      border: 7px solid transparent;
      border-top-color: #9c27b0;
    }
    .gift-scene:hover .gift-tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<div id="cpW" style="position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden;"></div>

<div class="main">

  <!-- ══ GIFT BOX ══ -->
  <div class="gift-scene" onclick="window.location='birthday.html'">

    <!-- Custom tooltip -->
    <div class="gift-tooltip">✨ TAP TO OPEN ✨</div>

    <!-- Sparkles -->
    <span class="sp sp1">✦</span>
    <span class="sp sp2">✦</span>
    <span class="sp sp3">★</span>
    <span class="sp sp4">✦</span>
    <span class="sp sp5">✦</span>
    <span class="sp sp6">★</span>

    <img src="gift.png" alt="Gift Box" class="gift-img" draggable="false" />
  </div>

  <!-- ══ LABEL ══ -->
  <div class="gift-label">
    <span class="lbl-to">TO</span>
    <div class="lbl-name">Mona</div>
    <span class="lbl-from">FROM <em>Ravindhar</em></span>
    <div class="lbl-tap">
      <span class="arr">∧</span>
      TAP TO OPEN
    </div>
  </div>

</div>

<script>
/* Confetti shower */
(function(){
  const w = document.getElementById('cpW');
  const cl = [
    '#9c27b0','#e91e8c','#f06292','#ab47bc',
    '#d81b60','#e040fb','#c2185b','#ba68c8',
    '#ff80ab','#7b1fa2','#f48fb1','#880e4f'
  ];
  function sp(){
    const el  = document.createElement('div');
    el.className = 'cp';
    const w2   = Math.random()*10+5;
    const h2   = Math.random()*14+6;
    const circ = Math.random() > .5;
    const dur  = (Math.random()*3.5+3).toFixed(1);
    el.style.cssText = `
      left:${Math.random()*100}%;
      width:${circ?w2:w2}px; height:${circ?w2:h2}px;
      background:${cl[Math.floor(Math.random()*cl.length)]};
      border-radius:${circ?'50%':'3px'};
      animation-duration:${dur}s;
      animation-delay:${(Math.random()*1.2).toFixed(1)}s;
    `;
    w.appendChild(el);
    setTimeout(() => el.remove(), (parseFloat(dur)+2)*1000);
  }
  for(let i=0; i<28; i++) setTimeout(sp, Math.random()*1500);
  setInterval(sp, 200);
})();
</script>
</body>
</html>
